model:
  name: cnn_mnist
  input_size: [1, 28, 28]
  output_dim: 10
  layers:
    - type: Conv2d
      out_channels: 16
      kernel_size: 3
      padding: 1
    - type: Conv2d
      out_channels: 32
      kernel_size: 3
      padding: 1
    - type: Conv2d
      out_channels: 64
      kernel_size: 3
      padding: 1
    - type: Flatten
    - type: Dropout
      p: 0.6
    - type: FC
      in_features: 50176
      out_features: 10
training:
  epochs: 10
  batch_size: 64
  lr: 0.0001
  optimizer: adam
  scheduler: cosine
dataset:
  name: mnist
  image_size: [28, 28]
  num_classes: 10
  task: classification
